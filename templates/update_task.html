<!DOCTYPE html>
<html>

<head>

    <title>Update Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h2>Update Task</h2>

        <form method="POST">

            <input type="text" name="title" value="{{ task.title }}" required>

            <textarea name="description">{{ task.description }}</textarea>

            <select name="priority">

                <option {% if task.priority == 'High' %}selected{% endif %}>High</option>

                <option {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>

                <option {% if task.priority == 'Low' %}selected{% endif %}>Low</option>

            </select>

            <select name="status">

                <option {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>

                <option {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>

            </select>

            <button type="submit">
                Update Task
            </button>

        </form>

    </div>

</div>

</body>

</html>
