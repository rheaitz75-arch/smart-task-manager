<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div style="display:flex; justify-content:center; align-items:center; min-height:90vh;">

        <div class="glass-card" style="width:420px;">

            <div style="text-align:center; margin-bottom:30px;">

                <h1 style="font-size:36px;">Create Account</h1>

                <p style="opacity:0.7;">
                    Join Smart Task Manager
                </p>

            </div>

            <form method="POST">

                <input 
                    type="text" 
                    name="username" 
                    placeholder="Enter username"
                    required
                >

                <input 
                    type="email" 
                    name="email" 
                    placeholder="Enter email"
                    required
                >

                <input 
                    type="password" 
                    name="password" 
                    placeholder="Enter password"
                    required
                >

                <button type="submit" class="btn-custom" style="width:100%;">
                    Register
                </button>

            </form>

            <div style="margin-top:25px; text-align:center;">

                <p>
                    Already have an account?
                </p>

                <a 
                    href="/login"
                    style="
                        color:#38bdf8;
                        text-decoration:none;
                        font-weight:600;
                    "
                >
                    Login Here
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
